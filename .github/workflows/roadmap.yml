name: Build the roadmap and publish it to GitHub Pages

# Builds the modules, runs their tests and renders the book on every push and pull request.
# On a push to main it also publishes book/target/site to GitHub Pages:
#
#   index.html               the book as one page
#   nasdanika-roadmap.pdf    the book as a PDF
#   nasdanika-roadmap.epub   the book as an EPUB
#
# In the repository's Settings > Pages, set Source to "GitHub Actions" and the custom domain to
# roadmap.sdk.nasdanika.org.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows the workflow to be run by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push does not cancel a deployment in progress
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build the modules, run the tests and render the book
      # Published editions leave the editor's notes out.
      # Fails on a failing test, a missing listing tag, a broken cross-reference or a missing image.
      run: mvn -B verify -Dbook.editor-notes=false
    - name: Keep the books with the run
      uses: actions/upload-artifact@v4
      with:
        name: nasdanika-sdk-roadmap
        path: book/target/book/nasdanika-sdk-roadmap-*.*
    - name: Upload the site for GitHub Pages
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: book/target/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
